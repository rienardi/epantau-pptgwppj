<title>Tatami Tutur</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: satu lajur sempit seperti app telefon; senarai pelajaran -> latihan dialog -> susun ayat. */
:root {
  --bg: #f3f1ec;
  --surface: #fbfaf7;
  --ink: #1d2338;
  --muted: #6a6f82;
  --line: #dcd9d0;
  --accent: #2b3a67;      /* indigo celup (aizome) */
  --accent-ink: #ffffff;
  --voice: #d4572a;       /* jingga kesumba, khas untuk butang sebut */
  --good: #2f7d55;
  --bad: #b3372f;
  --font-jp: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141829; --surface: #1c2136; --ink: #eceaf2; --muted: #9aa0b8; --line: #2c3250;
    --accent: #8fa3e8; --accent-ink: #12162a; --voice: #f08a5d; --good: #6cc496; --bad: #ef8a82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141829; --surface: #1c2136; --ink: #eceaf2; --muted: #9aa0b8; --line: #2c3250;
  --accent: #8fa3e8; --accent-ink: #12162a; --voice: #f08a5d; --good: #6cc496; --bad: #ef8a82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--voice); outline-offset: 2px; }
svg { width: 20px; height: 20px; flex: none; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-jp); font-weight: 800; font-size: 1.7rem; line-height: 1.1; letter-spacing: .02em; }
.brand small { display: block; font-family: var(--font-ui); font-weight: 500; font-size: .8rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.stats { display: flex; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; text-align: center; min-width: 64px; }
.stat b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--muted); }

.lead { color: var(--muted); margin: 0; }
.lessons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lesson {
  width: 100%; text-align: left; display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
}
.lesson:hover { border-color: var(--accent); }
.lesson .glyph { font-family: var(--font-jp); font-weight: 800; font-size: 1.9rem; color: var(--accent); text-align: center; }
.lesson h3 { margin: 0; font-size: 1.05rem; }
.lesson p { margin: 0; font-size: .85rem; color: var(--muted); }
.badge { font-size: .75rem; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.done { color: var(--good); border-color: var(--good); }

.bar { display: flex; align-items: center; gap: 12px; }
.back { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; color: var(--muted); }
.progress { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
h2 { margin: 0; font-size: 1.3rem; }
.sub { color: var(--muted); margin: 0; font-size: .9rem; }

.line { display: flex; flex-direction: column; gap: 8px; max-width: 92%; }
.line.b { align-self: flex-end; align-items: flex-end; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.line.b .bubble { border-radius: 18px 18px 4px 18px; border-color: var(--accent); }
.who { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.jp { font-family: var(--font-jp); font-weight: 600; font-size: 1.35rem; line-height: 1.5; }
.rom { font-size: .85rem; color: var(--accent); }
.ms { font-size: .9rem; color: var(--muted); }
.hide-rom .rom { display: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 99px; padding: 6px 14px; font-size: .88rem;
}
.chip.voice { background: var(--voice); border-color: var(--voice); color: #fff; font-weight: 700; }
.chip.live { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.result { font-size: .88rem; display: flex; flex-direction: column; gap: 6px; }
.result .meter { height: 6px; width: 160px; background: var(--line); border-radius: 99px; overflow: hidden; }
.result .meter i { display: block; height: 100%; background: var(--good); }
.good { color: var(--good); } .bad { color: var(--bad); }

.cta {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 14px 20px;
  font-weight: 700; font-size: 1rem; width: 100%;
}
.cta[disabled] { opacity: .45; cursor: default; }
.toggle { align-self: flex-start; }

.quiz-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.prompt { font-size: 1.1rem; font-weight: 500; }
.slot { min-height: 56px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; align-items: center; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 50px; }
.tile { font-family: var(--font-jp); font-weight: 600; font-size: 1.15rem; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.tile:hover { border-color: var(--accent); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { min-height: 1.5em; font-weight: 700; }

.finish { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 24px 0; }
.finish .big { font-family: var(--font-jp); font-weight: 800; font-size: 3.2rem; color: var(--accent); line-height: 1.1; }
.note { font-size: .82rem; color: var(--muted); }

.paths { display: flex; flex-direction: column; gap: 12px; }
.path { width: 100%; text-align: left; display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 20px; padding: 20px; }
.path.alt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.path .glyph { font-family: var(--font-jp); font-weight: 800; font-size: 2.6rem; text-align: center; line-height: 1; }
.path.alt .glyph { color: var(--voice); }
.path h3 { margin: 0; font-size: 1.2rem; }
.path p { margin: 2px 0 0; font-size: .85rem; opacity: .85; }
.sentence { font-family: var(--font-jp); font-weight: 800; font-size: 2rem; line-height: 1.3; overflow-wrap: anywhere; }
.s-h { color: var(--accent); } .s-k { color: var(--voice); } .s-j { color: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; }
.dot::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 6px; }
.tips { margin: 8px 0 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.note-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; font-size: .9rem; }
.note-box summary { cursor: pointer; font-weight: 700; }
.cta.alt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.cardch { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.bigc { font-family: var(--font-jp); font-weight: 800; font-size: 3rem; line-height: 1; text-align: center; color: var(--accent); }
.bigc.small { font-size: 1.6rem; }
.cardch b { font-size: 1.1rem; }
.cardch p { margin: 2px 0 0; font-size: .88rem; color: var(--muted); }
.cardch p.ex { color: var(--ink); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px; font-size: 1.05rem; font-weight: 500; }
.opt:hover { border-color: var(--accent); }
.opt.jpo { font-family: var(--font-jp); font-size: 1.7rem; }
.opt.right { border-color: var(--good); color: var(--good); }
.opt.wrong { border-color: var(--bad); color: var(--bad); }
.bigq { font-family: var(--font-jp); font-weight: 800; font-size: 4rem; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
.bigq.word { font-size: 2.6rem; }
.chart { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.cell { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; text-align: center; }
.cell span { display: block; font-family: var(--font-jp); font-weight: 600; font-size: 1.4rem; }
.cell small { color: var(--muted); font-size: .72rem; }

.levelbox { display: flex; flex-direction: column; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.tabs { display: flex; gap: 8px; }
.tab { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px; font-weight: 500; }
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pad { width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.pad svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.grid { stroke: var(--line); stroke-width: .5; stroke-dasharray: 2 2; }
.frame { fill: none; stroke: var(--line); stroke-width: .6; }
.stk { fill: none; stroke: var(--ink); stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
.stk.anim { stroke: var(--accent); }
.stk.good { stroke: var(--good); }
.stk.hint { stroke: var(--voice); }
.live { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.live.bad { stroke: var(--bad); }
.start-dot { fill: var(--voice); animation: pulse 1s infinite; }
.badge-n circle { fill: var(--voice); }
.badge-n text { fill: #fff; font-size: 4.6px; font-weight: 700; font-family: var(--font-ui); }
.chip[disabled] { opacity: .4; cursor: default; }
.tt-n, .tt-a { color: var(--ink); } .tt-p { color: var(--accent); } .tt-v { color: var(--voice); } .tt-l { color: var(--good); }
.tile.tt-p { border-color: var(--accent); }
ruby rt { font-size: .5em; font-weight: 400; color: var(--muted); }
.tkc { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.tkc small { font-family: var(--font-ui); font-weight: 400; font-size: .62rem; color: var(--muted); }
.formula { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { border: 1px solid currentColor; border-radius: 10px; padding: 6px 12px; font-family: var(--font-jp); font-weight: 600; }
.sentence.small { font-size: 1.5rem; }
.gl { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.gtok { display: flex; flex-direction: column; }
.gtok b { font-family: var(--font-jp); font-size: 1.1rem; }
.gtok small { color: var(--muted); font-size: .72rem; }
.blank { display: inline-block; min-width: 1.6em; border-bottom: 3px solid var(--voice); text-align: center; color: var(--voice); }
.tier { margin: 8px 0 0; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  function resample(pts, n) {
    var d = [0], i, out = [];
    for (i = 1; i < pts.length; i++) d[i] = d[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    var L = d[d.length - 1];
    if (L < 1e-6) { for (i = 0; i < n; i++) out.push(pts[0]); return out; }
    var j = 1;
    for (i = 0; i < n; i++) {

  function patAnswer(k) {

  /* ---------- Kuiz bacaan ---------- */
  var R = { g: null, qs: [], qi: 0, ok: 0, locked: false, words: false, s: null };

  function options(ans, poolArr) {
    var uniq = poolArr.filter(function (v, i) { return v !== ans && poolArr.indexOf(v) === i; });
    return shuffle(shuffle(uniq).slice(0, lv().nOpt - 1).concat([ans]));
  }
  function buildQs(g) {
    var qs = [], all = groupsOf(g.script).reduce(function (a, x) { return a.concat(x.chars); }, []);
    var kj = g.script === "kanji", L = S.lvl, canHear = !!voice && !kj && L >= 2;
    g.chars.forEach(function (c) {
      if (kj) {
        qs.push({ q: c.c, sub: "Apa maksud kanji ini?", ans: c.m, opts: options(c.m, all.map(function (x) { return x.m; })), say: c.w.kana, tip: L === 1 ? c.tip : "" });
        qs.push({ q: c.w.jp, sub: "Apa maksud perkataan ini?", ans: c.w.ms, opts: options(c.w.ms, all.map(function (x) { return x.w.ms; })), word: true, say: c.w.kana, rom: c.w.rom });
        if (L >= 2) qs.push({ q: c.m, textq: true, sub: "Pilih kanji untuk maksud ini.", ans: c.c, opts: options(c.c, all.map(function (x) { return x.c; })), jpo: true, say: c.w.kana });
      } else {
        qs.push({ q: c.c, sub: "Apa bunyi huruf ini?", ans: c.r, opts: options(c.r, all.map(function (x) { return x.r; })), say: c.c, tip: L === 1 ? c.tip : "" });
        if (L >= 2) qs.push({ q: c.r, textq: true, sub: "Pilih huruf untuk bunyi ini.", ans: c.c, opts: options(c.c, all.map(function (x) { return x.c; })), jpo: true, say: c.c });
        if (canHear) qs.push({ hear: c.c, sub: "Dengar bunyinya, kemudian pilih huruf yang betul.", ans: c.c, opts: options(c.c, all.map(function (x) { return x.c; })), jpo: true, say: c.c });
      }
    });
    return shuffle(qs);
  }
  function wordQs(s) {
    var pool = WORDS[s], items = shuffle(pool).slice(0, 8);
    return items.map(function (w) {
      return { q: w[0], sub: "Baca perkataan ini. Apa maksudnya?", ans: w[3], opts: options(w[3], pool.map(function (x) { return x[3]; })), word: true, say: w[1], rom: w[2] };
    });
  }

  function startQuiz(g, words, s) {
    R = { g: g, qs: words ? wordQs(s) : buildQs(g), qi: 0, ok: 0, locked: false, words: !!words, s: s || (g && g.script) };
    renderQ();
  }
  function renderQ() {
    var q = R.qs[R.qi], back = R.words ? ['script', 'data-s="' + R.s + '"', 'Keluar'] : ['learn', 'data-g="' + R.g.id + '"', 'Keluar'];
    app.innerHTML =
      '<div class="bar"><button class="back" data-act="' + back[0] + '" ' + back[1] + '>' + back[2] + '</button><div class="progress"><i style="width:' + Math.round(R.qi / R.qs.length * 100) + '%"></i></div></div>' +
      '<div class="quiz-card"><div class="sub">' + esc(q.sub) + ' (' + (R.qi + 1) + '/' + R.qs.length + ') ' + lvBadge() + '</div>' +
      (q.hear ? '<div style="text-align:center"><button class="chip voice" data-act="saychar" data-c="' + esc(q.hear) + '">' + ICON.play + 'Dengar lagi</button></div>' : '<div class="bigq' + (q.word || q.textq ? ' word' : '') + '">' + esc(q.q) + '</div>' + (q.tip ? '<div class="note">Petua: ' + esc(q.tip) + '</div>' : '')) +
      '<div class="opts">' + q.opts.map(function (o, k) {

      }).join("") + '</div><div class="feedback" id="fb"></div></div>';
    if (q.hear) say(q.hear, false);
  }
  function answer(k) {
    if (R.locked) return;
    R.locked = true;
    var q = R.qs[R.qi], ok = q.opts[k] === q.ans, btns = app.querySelectorAll(".opt");
    btns.forEach(function (b, i) {
      if (q.opts[i] === q.ans) b.classList.add("right");
      else if (i === k) b.classList.add("wrong");
    });
    if (ok) { R.ok++; award(3 * S.lvl); }
    var fb = document.getElementById("fb");
    fb.className = "feedback " + (ok ? "good" : "bad");
    fb.textContent = (ok ? "Betul!" : "Jawapan: " + q.ans) + (q.rom ? " · " + q.rom : "");
    say(q.say, false);
    var last = R.qi === R.qs.length - 1;
    app.insertAdjacentHTML("beforeend", '<button class="cta" data-act="rnext">' + (last ? 'Lihat keputusan' : 'Soalan seterusnya') + '</button>');

    setResult(i, '<span>Tak dapat guna mikrofon. Sebut kuat-kuat, lalu nilai sendiri:</span><div class="actions">' +

  function speak(i) {
    var ln = V.lesson.lines[i], btn = document.getElementById("sp" + i);
    if (!SR) { selfRate(i); return; }
    var rec = new SR();
    rec.lang = "ja-JP"; rec.interimResults = false; rec.maxAlternatives = 3;
    btn.classList.add("live"); setResult(i, '<span class="note">Mendengar... sebut ayat tadi.</span>');
    var got = false;
    rec.onresult = function (e) {
      got = true;
      var best = 0, heard = "";
      for (var k = 0; k < e.results[0].length; k++) {
        var t = e.results[0][k].transcript, sc = similarity(t, ln);
        if (sc >= best) { best = sc; heard = t; }
      }
      var pct = Math.round(best * 100), ok = pct >= 70;
      setResult(i, '<span class="' + (ok ? 'good' : 'bad') + '"><b>' + pct + '%</b> ' + (ok ? 'Sebutan bagus!' : 'Cuba lagi, dengar dahulu.') + '</span>' +
        '<div class="meter"><i style="width:' + pct + '%"></i></div><span class="note">Didengar: ' + esc(heard) + '</span>');
      if (ok) award(2);
    };
    rec.onerror = function () { got = true; selfRate(i); };
    rec.onend = function () { btn.classList.remove("live"); if (!got) setResult(i, '<span class="note">Tiada suara dikesan. Tekan Sebut dan cuba lagi.</span>'); };
    try { rec.start(); } catch (e) { selfRate(i); }
  }

      '<div class="slot" id="slot">' + V.placed.map(function (t, k) { return '<button class="tile" data-act="unpick" data-k="' + k + '">' + esc(t) + '</button>'; }).join("") + '</div>' +
      '<div class="pool">' + V.pool.map(function (t, k) { return '<button class="tile" data-act="pick" data-k="' + k + '">' + esc(t) + '</button>'; }).join("") + '</div>' +
      '<div class="feedback ' + (cls || '') + '">' + (msg || '') + '</div>' +
      '<button class="chip" data-act="hint">' + ICON.play + 'Dengar jawapan</button></div>';
  }

  function check() {
    var ln = V.lesson.lines[V.qi], ok = V.placed.join("") === ln.t.join("");
    if (ok) {
      V.locked = true;
      award(V.tries === 0 ? 10 : 5);
      say(ln.kana);
      renderQuiz("Betul! " + ln.jp, "good");
      var last = V.qi === V.lesson.lines.length - 1;
      app.insertAdjacentHTML("beforeend", '<button class="cta" data-act="next">' + (last ? 'Selesai' : 'Ayat seterusnya') + '</button>');
    } else {
      V.tries++;
      V.pool = shuffle(ln.t); V.placed = [];
      renderQuiz("Belum tepat. Cuba susun semula.", "bad");
      var s = document.getElementById("slot"); if (s) s.classList.add("shake");
    }
  }

  function finish() {
    var L = V.lesson, first = !S.done[L.id];
    S.done[L.id] = true; bumpStreak(); save();
    app.innerHTML = bar(100) +
      '<div class="finish"><div class="big">できた</div><h2>Pelajaran ' + esc(L.title) + ' selesai</h2>' +
      '<p class="sub">+' + V.gained + ' XP' + (first ? ' dan pelajaran baharu ditandakan selesai' : '') + '. Streak anda ' + S.streak + ' hari.</p>' +
      '<button class="cta" data-act="speakhome">Kembali ke senarai</button>' +
      '<button class="chip" data-act="open" data-id="' + L.id + '">Ulang pelajaran ini</button></div>';
  }

  /* ---------- Acara ---------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act, i = +b.dataset.i, k = +b.dataset.k;
    if (act === "open") {
      V.lesson = LESSONS.filter(function (l) { return l.id === b.dataset.id; })[0];
      V.phase = "practice"; V.qi = 0; V.gained = 0; practice(); window.scrollTo(0, 0);
    } else if (act === "hub" || act === "speakhome" || act === "readhome" || act === "script" || act === "learn" || act === "rquiz" || act === "words") {
      if (window.speechSynthesis) speechSynthesis.cancel();
      if (act === "hub") hub(); else if (act === "speakhome") speakHome(); else if (act === "readhome") readHome();
      else if (act === "script") scriptHome(b.dataset.s); else if (act === "learn") learn(b.dataset.g);
      else if (act === "rquiz") startQuiz(groupById(b.dataset.g));
      else startQuiz(null, true, b.dataset.s);
      window.scrollTo(0, 0);
    }
    else if (act === "saychar") say(b.dataset.c, false);
    else if (act === "ans") answer(k);
    else if (act === "rnext") { R.locked = false; if (R.qi >= R.qs.length - 1) rfinish(); else { R.qi++; renderQ(); window.scrollTo(0, 0); } }
    else if (act === "lvl") { S.lvl = +b.dataset.l; save(); hub(); }
    else if (act === "writehome") { writeHome(); window.scrollTo(0, 0); }
    else if (act === "wscript") { wScript(b.dataset.s); window.scrollTo(0, 0); }
    else if (act === "wgroup") { clearTimers(); wGroup(b.dataset.g); window.scrollTo(0, 0); }
    else if (act === "wopen") { writer(i, b.dataset.m); window.scrollTo(0, 0); }
    else if (act === "wmode") writer(W.idx, b.dataset.m);
    else if (act === "wreplay") watch();
    else if (act === "wreset") writer(W.idx, "draw");
    else if (act === "whint") hint();
    else if (act === "senthome") { senthome(); window.scrollTo(0, 0); }
    else if (act === "patlearn") { patLearn(b.dataset.p); window.scrollTo(0, 0); }
    else if (act === "patquiz") { patQuiz(b.dataset.p); window.scrollTo(0, 0); }
    else if (act === "pans") patAnswer(k);
    else if (act === "snext") patNext();
    else if (act === "spick" && !Q.locked) { Q.placed.push(Q.pool.splice(k, 1)[0]); renderArrange(); }
    else if (act === "sunpick" && !Q.locked) { Q.pool.push(Q.placed.splice(k, 1)[0]); renderArrange(); }
    else if (act === "sclear" && !Q.locked) { Q.pool = Q.pool.concat(Q.placed); Q.placed = []; renderArrange(); }
    else if (act === "scheck" && !Q.locked) arrangeCheck();
    else if (act === "rom") { S.rom = !S.rom; save(); practice(); }
    else if (act === "play") say(V.lesson.lines[i].kana, false);
    else if (act === "slow") say(V.lesson.lines[i].kana, true);
    else if (act === "speak") speak(i);
    else if (act === "rate") {
      setResult(i, '<span class="' + (k ? 'good' : 'bad') + '">' + ['Tidak mengapa, dengar lagi dan ulang.', 'Bagus, teruskan.', 'Hebat!'][k] + '</span>');
      if (k) award(k);
    }
    else if (act === "quiz") { V.phase = "quiz"; V.qi = 0; quiz(); window.scrollTo(0, 0); }
    else if (act === "pick" && !V.locked) { V.placed.push(V.pool.splice(k, 1)[0]); renderQuiz(); if (!V.pool.length) check(); }
    else if (act === "unpick" && !V.locked) { V.pool.push(V.placed.splice(k, 1)[0]); renderQuiz(); }
    else if (act === "hint") say(V.lesson.lines[V.qi].kana, false);
    else if (act === "next") {
      if (V.qi >= V.lesson.lines.length - 1) finish(); else { V.qi++; quiz(); window.scrollTo(0, 0); }
    }
  });

  hub();
})();
</script>
